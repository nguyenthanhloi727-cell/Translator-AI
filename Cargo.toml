[package]
name = "translator-ai"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local realtime English-to-Vietnamese subtitle translator for streamers"

[dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
] }

# Dich bang CTranslate2 (C++ bien dich tinh vao .exe, chay CPU). Chi bat tokenizers (HF) + ruy.
ct2rs = { version = "=0.11.2", default-features = false, features = ["tokenizers", "ruy"] }
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
